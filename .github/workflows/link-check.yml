name: Link check

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429: some docs and npm pages block or rate-limit CI bots but load fine in a browser
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,403,429
            --exclude "^https://fonts\.(googleapis|gstatic)\.com"
            index.html README.md data/catalog.json
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'push'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken-links
